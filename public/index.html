<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quota-board</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topo">
  <h1>quota-board</h1>
  <p class="estado-geral" id="estado-geral">consultando…</p>
  <div class="acoes">
    <button type="button" id="atualizar" title="Consultar as CLIs agora">Atualizar</button>
    <button type="button" id="tema" title="Claro ou escuro">Tema</button>
  </div>
</header>
<main>
  <section id="contas" aria-label="Cotas das contas">
    <p class="aviso-contas" hidden></p>
    <div class="contas-grade" id="contas-grade"></div>
  </section>
  <p class="rodape">As consultas são comandos administrativos da própria CLI (<code>claude -p /usage</code>, <code>codex app-server</code>, <code>agy -p /quota</code>): nenhum token é gasto e nada sai desta máquina. Clique num card para ver o detalhe de uma janela; Esc volta.</p>
</main>
<script src="app.js"></script>
</body>
</html>
